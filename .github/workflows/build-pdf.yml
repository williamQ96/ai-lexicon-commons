name: Build handbook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and compile handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate handbook from shared content
        run: python3 scripts/generate.py

      - name: Install TeX from Ubuntu package registry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Compile PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -pdflatex="pdflatex -no-shell-escape %O %S" main.tex
          test -s build/main.pdf
          sha256sum build/main.pdf

      - name: Record public PDF snapshot
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/generate.py --snapshot --source-commit "$SOURCE_COMMIT" --run-url "$RUN_URL"
          python3 scripts/generate.py --check

      - name: Upload handbook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handbook-${{ github.sha }}
          path: |
            docs/*.html
            docs/glossary.pdf
            docs/PDF-SNAPSHOT.*
            docs/BUILD-INFO.json
            docs/terms/
            docs/assets/
            main.tex
            references.bib
          if-no-files-found: error
          retention-days: 30

      - name: Export public bootstrap content
        run: python3 scripts/generate.py --export
